---
- name: configure frontend service
  hosts: frontend
  become: yes
  tasks:
  - name: install nginx
    ansible.builtin.command: dnf module install nginx:1.24 -y 

  - name: start enable nginx
    ansible.builtin.service:
     name: nginx
     state: restarted
     enabled: yes 

  - name: remove defalt content
    ansible.builtin.file:
    path: /usr/share/nginx/html/  
