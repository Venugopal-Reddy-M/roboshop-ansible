---

- name: create cart service
  hosts: cart
  become: yes
  tasks:
  - name: enable the nodejs-20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: add system user
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user" 
    
  - name: delete app directory 
    ansible.builtin.file:
      path: /app
      state: absent

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
  
  - name: delete the zip_file
    ansible.builtin.file:
      path: /tmp/cart.zip
      state: absent

  - name: download the cart code
    ansible.builtin.get_url:
      path: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip

  - name: unzip the cart file
    ansible.builtin.file:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: copy the service file
    ansible.builtin.copy:
    src: cart.service
    dest: /etc/systemd/system/cart.service

  - name: deamon reload user service
    ansible.builtin.systemd_service:
      state: restarted
      daemon_reload: true
      name: user

  - name: start user
    ansible.builtin.service:
      name: user
      state: restarted
      enabled: yes 


    
