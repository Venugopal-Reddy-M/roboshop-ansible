- name: mongodb configure
  hosts: mongodb
  become: yes

  tasks:
  - name: copy mongorepo
    ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

  - name: package install
    ansible.builtin.dnf:
      name: mongodb-org
      state: present

  - name: start and enable mongodb
    ansible.builtin.service:
      name: mongod
      enabled: yes
      state: started

  - name: allow remoto connections
    ansible.builtin.replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0' 

  - name: restart mongodb
    ansible.builtin.service:
      name: mongod
      state: restarted
