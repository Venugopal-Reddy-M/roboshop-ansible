- name: create ec2-instance and route53
  hosts: all
  connection: local
  become: yes

  vars:
  sg_id: sg-09e04001ff20131f1
  ami_id: ami-0220d79f3f480ecf5
  env: dev
  instances:
  - mongodb
  - catalogue

  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }}-{{ env }}"

      tags:
       Project: roboshop
       Component: "{{ item }}"
       Environment: "{{ env }}"
       name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2-output

  - name: print the ec2-output
    ansible.builtin.debug:
     msg: "{{ ec2-output }}"