- name: create ec2-instance and route53
  hosts: all
  connection: local
  vars:
    sg_id: sg-09e04001ff20131f1
    ami_id: ami-0220d79f3f480ecf5
    domain_name: solohunting.online
    env: dev
    action: create
    instances:
      - mongodb
      - catalogue

  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        instance_type: t3.micro
        security_group: "{{ sg_id }}"
        image_id: "{{ ami_id }}"
        region: us-east-1
        name: "{{ item }}-{{ env }}"
        tags:
          Project: roboshop
          Component: "{{ item }}"
          Environment: "{{ env }}"
          Name: "{{ item }}-{{ env }}"
      loop: "{{ instances }}"
      register: ec2_output
      when: action == "create"

   ## Print output
    - name: print the ec2-output
      ansible.builtin.debug:
        msg: "{{ ec2_output }}"

  ### create r53 records 
    - name: create records in route53
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}-{{ env }}.{{ domain_name }}"  # mongodb-dev.solohunting.online
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"

    ## create r53 records frontend
    - name: create records in route53
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "roboshop-{{ env }}.{{ domain_name }}"  #roboshop.dev.solohuntong.online
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        wait: true
      loop: "{{ ec2_output.results }}"
      when: 
      - item.item == "frontend"
      - action == "create"

    - name: delete ec2 instances
      amazon.aws.ec2_instance:
        state: absent
         name: "{{ item }}-{{ env }}"
        loop: "{{ instances }}" 
        when : action == "destroy"
  
    - name: delete r53 records
      amazon.aws.route53:
       state: absent
       zone: "{{ domain_name }}"
       record: "{{ item }}-{{ env }}.{{ domain_name }}"
       type: A
       ttl: 1
      loop: "{{ instances }}"
      when : action == "destroy"

