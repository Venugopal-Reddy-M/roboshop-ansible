---

- name: configure payment service
  hosts: payment
  become: yes
  tasks:
  - name: install packages
    ansible.builtin.dnf:
      name: "{{ item }}"
    loop:
    - python3
    - gcc
    - python3-devel
  
  - name: add system user
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"

  - name: delete app directory
    ansible.builtin.file:
    path: /app
    state: absent

  - name: create app directory
    ansible.builtin.file:
    path: /app
    state: present

  - name: delete payment zip_file
    ansible.builtin.file:
       path: /tmp/payment.zip
       state: absent

  - name: Download code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
      dest: /tmp/payment.zip
  
  - name: unarchive file 
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    ansible.builtin.pip:
     requirements: requirements.txt
     executable: pip3.
     args:
       chdir: /app

  - name: copy payment repo
    ansible.builtin.template:
      src: payment.service
      dest: /etc/systemd/system/payment.service

  - name: deamon reload
    ansible.builtin.systemd_service:
    daemon_reload: true

  - name: start and enable reload
    ansible.builtin.service:
      name: payment
      state: restarted
      enabled: yes



    