---

- name: configure the rabbitmq
  hosts: rabbitmq
  become: yes
  tasks:
  - name: copy rabbitmq repo
    ansible.builtin.template:
     src: rabbitmq.repo
     dest: /etc/yum.repos.d/rabbitmq.repo

  - name: install rabbitmq 
    ansible.builtin.dnf:
      name: rabbitmq-server
      state: present

  - name: start and enable rabbitmq-server
    ansible.builtin.service:
      name: rabbitmq-server
      state: restarted
      enabled: yes

  - name: create user_name and password
    community.rabbitmq.rabbitmq_user:
      user: roboshop 
      password: roboshop123
      permissions:
         - vhost: /
           configure_priv: .*
           read_priv: .*
           write_priv: .*
      state: present
